name: Symmetry contracts
on:
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.github/workflows/symmetry-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.91.1 --profile minimal
      - name: Check final fields, acceptance, support, fallback and cluster coverage
        run: cargo test --locked -p blaze2d-interface --test band_accuracy --test pt_sectors --test metric_support --test coarse_start
      - name: Check bounded scheduling, continuation and cancellation
        run: cargo test --locked -p blaze2d-runner --test studies
      - name: Check complete worker profiling
        run: cargo test --locked -p blaze2d-runner --test profiling --features profiling
