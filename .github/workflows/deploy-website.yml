name: Deploy website
on:
  push:
    branches: [main]
    paths: ['web/**', 'crates/**', 'examples/calculations/**', 'Cargo.*', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  acceptance:
    uses: ./.github/workflows/site-checks.yml
  build:
    needs: acceptance
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      NEXT_BASE_PATH: /blaze2d
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install build tools
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.91.1
          cargo install wasm-pack --version 0.13.1 --locked
          pnpm install --frozen-lockfile
      - name: Build from the tested source revision
        run: pnpm build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/out
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
