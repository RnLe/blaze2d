name: Deploy website
on:
  push:
    branches: [main]
    paths: ['web/**', 'crates/**', 'examples/calculations/**', 'Cargo.*', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  acceptance:
    uses: ./.github/workflows/site-checks.yml
    with:
      mode: smoke
  deploy:
    needs: acceptance
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
