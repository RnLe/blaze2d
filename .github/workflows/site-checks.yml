name: Website checks
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', 'crates/**', 'examples/calculations/**', 'Cargo.*', '.github/workflows/site-checks.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        base: ['', '/blaze2d']
    env:
      NEXT_BASE_PATH: ${{ matrix.base }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Rust and browser build tools
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.91.1
          cargo install wasm-pack --version 0.13.1 --locked
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check public prose
        run: python3 ../scripts/check-public-prose.py
      - name: Build and verify the production export
        run: |
          pnpm build
          pnpm exec tsc --noEmit
          pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.base == ''
        with:
          name: browser-solver
          path: web/public/wasm-blaze
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures-${{ strategy.job-index }}
          path: web/test-results
          retention-days: 7
