name: Release Python package
on:
  push:
    branches: ['release/interface-v07']
    tags: ['v0.7.0rc*', 'v0.7.0']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  website:
    uses: ./.github/workflows/site-checks.yml
  science:
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: cargo test --locked -p blaze2d-core -p blaze2d-interface -p blaze2d-runner
      - run: cargo test --locked -p blaze2d-core -p blaze2d-interface --no-default-features --features wasm-linalg
      - run: cargo build --locked --release -p blaze2d-cli
      - run: python3 scripts/check-public-prose.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cli
          path: target/release/blaze2d
          if-no-files-found: error
  wheels:
    strategy:
      fail-fast: false
      matrix:
        python:
          - { version: '3.10', abi: cp310 }
          - { version: '3.11', abi: cp311 }
          - { version: '3.12', abi: cp312 }
          - { version: '3.13', abi: cp313 }
          - { version: '3.14', abi: cp314 }
        platform:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, cpu: x86-64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, cpu: x86-64 }
          - { runner: macos-15, target: aarch64-apple-darwin, cpu: generic }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc, cpu: x86-64 }
    runs-on: ${{ matrix.platform.runner }}
    env:
      BLAZE_SOURCE_REVISION: ${{ github.sha }}
      RUSTFLAGS: -C target-cpu=${{ matrix.platform.cpu }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python.version }}
      - name: Record source provenance
        run: python scripts/prepare-sdist.py
      - name: Build portable wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.91.1'
          target: ${{ matrix.platform.target }}
          manylinux: '2014'
          container: ${{ matrix.platform.runner == 'ubuntu-22.04' && 'quay.io/pypa/manylinux2014_x86_64@sha256:21c37461985655aaa25ed3a923b28e6c9d4dd9e10edc0281eb50385184bddd31' || '' }}
          docker-options: --env RUSTFLAGS --env BLAZE_SOURCE_REVISION
          args: >-
            --locked --manifest-path crates/python/Cargo.toml --out dist
            --interpreter ${{ matrix.platform.runner == 'ubuntu-22.04' && format('/opt/python/{0}-{0}/bin/python', matrix.python.abi) || 'python' }}
      - name: Install and test outside the repository
        run: python scripts/test-wheel.py --wheel-dir dist --revision ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform.target }}-${{ matrix.python.abi }}
          path: dist/*.whl
          if-no-files-found: error
  source:
    runs-on: ubuntu-22.04
    env:
      BLAZE_SOURCE_REVISION: ${{ github.sha }}
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: python -m pip install maturin==1.15.0
      - run: python scripts/prepare-sdist.py
      - run: python scripts/build-sdist.py --out dist
      - name: Build the unpacked source distribution
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          env -u BLAZE_SOURCE_REVISION python -m pip wheel "$GITHUB_WORKSPACE"/dist/*.tar.gz --no-deps --wheel-dir "$RUNNER_TEMP/source-wheel"
          cd "$GITHUB_WORKSPACE"
          python scripts/test-wheel.py --wheel-dir "$RUNNER_TEMP/source-wheel" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
  interfaces:
    needs: [science, website, wheels]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wheel-x86_64-unknown-linux-gnu-cp312
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-cli
          path: dist/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-solver
          path: web/public/wasm-blaze
      - name: Compare scientific outputs across all entry points
        run: |
          python -m pip install dist/*.whl
          chmod +x dist/native/blaze2d
          python scripts/verify-interfaces.py --native dist/native/blaze2d --wasm web/public/wasm-blaze --output parity-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: interface-comparisons
          path: parity-results
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [science, website, wheels, source, interfaces]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/blaze2d/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-distribution
          path: dist
      - run: python -m pip install packaging==26.0 twine==6.2.0
      - run: python scripts/check-release.py dist
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
