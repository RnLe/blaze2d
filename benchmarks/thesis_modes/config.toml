schema = "blaze2d/1"
task = "bands"
polarization = "TM"

[geometry]
background_epsilon = 1.0
lattice = { type = "square", a = 1.0 }

[[geometry.objects]]
name = "rod"
kind = "circle"
center = [0.0, 0.0]
radius = 0.2
epsilon = 8.9

[grid]
resolution = 64

[dielectric]
smoothing = "analytic"

[bands]
count = 12
tracking = false
path = { points = [[0.5, 0.5]], basis = "reciprocal_fractional" }

[eigensolver]
precision = "f64"
tolerance = 1e-14
max_iterations = 1000

[results]
eigenvectors = true
