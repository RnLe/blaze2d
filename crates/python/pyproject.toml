[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "blaze2d"
dynamic = ["version"]
description = "BLAZE - Band-structure LOBPCG Accelerated Zone Eigensolver for 2D Photonic Crystals"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "RnLe", email = "rene.marcel.lehner@gmail.com" }
]
keywords = [
    "photonic-crystals",
    "band-structure",
    "eigensolver",
    "LOBPCG",
    "physics",
    "simulation",
    "computational-physics",
    "materials-science"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/RnLe/blaze2d"
Repository = "https://github.com/RnLe/blaze2d"
Documentation = "https://rnle.github.io/blaze2d/configuration"

[project.optional-dependencies]
progress = ["rich>=13"]
plot = ["matplotlib>=3.5"]
all = ["matplotlib>=3.5", "rich>=13"]

[tool.maturin]
# Build the cdylib with bindings feature
features = ["bindings"]
# Python module name ; compiled .so goes into blaze/_native.so
module-name = "blaze._native"
# Python source directory (contains blaze/ package)
python-source = "."
# Use release-python profile (allows panic unwinding for catch_unwind)
profile = "release-python"
# Strip debug symbols for smaller binaries
strip = true
# Include only the necessary files
include = [
    "README.md",
    "LICENSE",
]
