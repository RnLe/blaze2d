[package]
name = "blaze2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "BLAZE - Band-structure LOBPCG Accelerated Zone Eigensolver for 2D Photonic Crystals"
repository = "https://github.com/RnLe/blaze2d"
keywords = ["photonic-crystals", "band-structure", "eigensolver", "physics"]
categories = ["science", "simulation"]

[lib]
name = "blaze"
crate-type = ["cdylib", "rlib"]
# Note: the pymodule is named "_native" via #[pymodule(name = "_native")]
# so maturin installs it as blaze/_native.so

[features]
default = []
bindings = ["dep:pyo3", "dep:numpy"]

[dependencies]
log.workspace = true
blaze2d-core = { path = "../core" }
blaze2d-backend-cpu = { path = "../backend-cpu" }
pyo3 = { version = "=0.29.2", features = ["extension-module"], optional = true }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

blaze2d-interface = { path = "../interface" }
blaze2d-runner = { path = "../runner" }
numpy = { version = "=0.29.0", optional = true }
